version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: request_meter_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: meter_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  
  redis:
    image: redis:7-alpine
    container_name: request_meter_redis
    ports:
      - "6379:6379"

  api1:
    build: .
    environment:
      - DATABASE_URL=postgres://admin:password@postgres:5432/meter_db?sslmode=disable
      - REDIS_ADDR=redis:6379
      - SERVER_PORT=8080
      - SYNC_INTERVAL=500ms
    ports:
      - "8081:8080"
    depends_on:
      - postgres
      - redis

  api2:
    build: .
    environment:
      - DATABASE_URL=postgres://admin:password@postgres:5432/meter_db?sslmode=disable
      - REDIS_ADDR=redis:6379
      - SERVER_PORT=8080
      - SYNC_INTERVAL=500ms
    ports:
      - "8082:8080"
    depends_on:
      - postgres
      - redis

  api3:
    build: .
    environment:
      - DATABASE_URL=postgres://admin:password@postgres:5432/meter_db?sslmode=disable
      - REDIS_ADDR=redis:6379
      - SERVER_PORT=8080
      - SYNC_INTERVAL=500ms
    ports:
      - "8083:8080"
    depends_on:
      - postgres
      - redis

volumes:
  pgdata: